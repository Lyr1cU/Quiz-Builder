<div class="max-w-[64rem] mx-auto">
<!-- Page Header -->
<div class="mb-8 text-center md:text-left">
<h1 class="font-headline text-5xl font-bold text-white mb-2">Create quiz</h1>
<p class="text-surface-container-highest text-lg max-w-xl">Build a quiz with questions and answers. Craft engaging assessments for your students or peers.</p>

<!-- Quiz Creation Form -->
<form class="space-y-8">
<!-- Basic Info Card -->
<section class="bg-surface-container-lowest rounded-lg shadow-xl p-8 border border-outline-variant/20">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="md:col-span-2">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-4" for="quiz-title">Title</label>
<input class="w-full h-12 px-6 rounded-full border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold transition-all text-on-surface placeholder:text-outline" id="quiz-title" placeholder="e.g., Introduction to World History" type="text"/>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-4" for="quiz-description">Description</label>
<textarea class="w-full px-6 py-4 rounded-lg border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold transition-all text-on-surface placeholder:text-outline" id="quiz-description" placeholder="Tell your audience what this quiz is about..." rows="3"></textarea>
</div>
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-4" for="quiz-visibility">Visibility</label>
<div class="relative">
<select class="w-full h-12 px-6 rounded-full border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold appearance-none transition-all text-on-surface" id="quiz-visibility">
<option value="public">Public</option>
<option value="private">Private</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
</div>
</section>

<div class="space-y-6">
<h2 class="font-headline text-3xl font-bold text-white drop-shadow-md">Questions</h2>
<!-- Question Block 1 -->
<div class="bg-surface-container-lowest rounded-lg shadow-lg p-8 border-l-8 border-brand-gold relative group overflow-hidden">
<div class="absolute top-4 right-6 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-2 text-outline hover:text-error transition-colors" type="button"><span class="material-symbols-outlined">delete</span></button>
</div>
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">

<input class="w-full h-12 px-6 rounded-full border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold transition-all text-on-surface" placeholder="Enter your question text here" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-2 ml-4">Type</label>
<div class="relative">
<select class="w-full h-12 px-6 rounded-full border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold appearance-none transition-all text-on-surface">

<option value="multiple">Multiple Choice</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>

<div class="pl-4 pr-2">
<input class="w-5 h-5 text-brand-gold focus:ring-brand-gold border-outline-variant" name="q1-correct" type="radio"/>
</div>
<input class="flex-grow bg-transparent border-none focus:ring-0 px-2 py-3 text-on-surface" type="text" value="Rome"/>
<div class="px-4 text-outline text-xs font-semibold opacity-0 group-hover/row:opacity-100">CORRECT</div>
</div>
</div>
<!-- Option Row 2 -->

<input class="w-full h-12 px-6 rounded-full border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-brand-gold focus:border-brand-gold transition-all text-on-surface" placeholder="Which of these are primary colors?" type="text"/>

<input checked="" class="w-5 h-5 rounded text-brand-teal focus:ring-brand-teal border-outline-variant" type="checkbox"/>
</div>

</div>
</div>
</div>
</div>

<!-- Form Actions -->
<div class="flex flex-col sm:flex-row gap-4 items-center justify-between pt-6">
<button class="w-full sm:w-auto h-12 px-10 rounded-full border-2 border-brand-teal text-brand-teal font-bold hover:bg-brand-teal hover:text-white transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">add</span>
                        Add question
                    </button>
<button class="w-full sm:w-auto h-14 px-12 rounded-full gold-gradient-btn text-white font-bold text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">

<div class="fixed top-[20%] left-[5%] w-64 h-64 bg-brand-gold/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-[10%] right-[10%] w-96 h-96 bg-brand-teal/5 blur-[150px] rounded-full -z-10 pointer-events-none"></div>
<script>
        // Micro-interactions for form feedback
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.classList.add('ring-offset-2');
            });
            el.addEventListener('blur', () => {
                el.parentElement.classList.remove('ring-offset-2');
            });
        });

        // Simple button click effect
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.type !== 'submit') e.preventDefault();
                // Logic for adding questions or rows could go here
            });
        });
    </script>
